- name: Note
  description: Free-form text associated with a record (soft-delete on archive)
  belongs_to: Record
- name: TimelineEvent
  description: Chronological activity entry for a record (task/note/attribute-change/relationship events)
  belongs_to: Record
- name: Integration
  description: Connected source system that ingests signal into the graph
  providers: [google, microsoft, slack, attio, hubspot, salesforce, whatsapp]
- name: Insight
  description: AI-derived signal streamed from the graph (SSE)
- name: KnowledgeGraph
