aid: nex
name: Nex
description: >-
  Nex is the workflow execution and context layer for AI-native business
  operations — where AI workflows become reliable business software. It builds a
  unified context graph from a company's connected tools (email, calendar, Slack,
  and CRMs like HubSpot, Salesforce, and Attio) plus ingested unstructured
  context, then grounds AI agents in that shared organizational memory. The Nex
  Developer API is a REST API over the context graph: define object types and
  attributes, create records and typed relationships, group them into lists,
  attach tasks and notes, read record timelines, ingest context, ask grounded
  natural-language questions, stream AI-derived insights over SSE, run full-text
  search, and trigger compounding intelligence jobs. Authentication is via scoped
  API keys, and organizational context is also exposed to agents through a
  first-party Model Context Protocol (MCP) server shipped as the nex CLI.
